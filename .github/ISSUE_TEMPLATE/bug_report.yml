name: Bug report
description: Report a reproducible NULNUL problem or uncomfortable behavior
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private source code, raw conversations, or personal data.
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What did you ask Codex to do? Remove private details.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Codex or Claude Code version and operating system
    validations:
      required: true
